<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q2 Seatwork 1</title>
<link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
<script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

<style>
        body {
            background-image: url("https://i.pinimg.com/1200x/19/36/05/193605ef29b345c5675657a3f48dfc99.jpg");
            color: white;
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background: url("https://i.pinimg.com/1200x/19/36/05/193605ef29b345c5675657a3f48dfc99.jpg");
            background-size: cover;
            background-position: center;

            -webkit-filter: blur(5px);
            filter: blur(5px);

            z-index: -1;
        }

        h1 {
            font-size: 35px;
            margin-bottom: 10px;
            justify-self: center;
            font-weight: 700;
            letter-spacing: 2px;
            color: white;
            text-shadow:
                0 0 8px rgba(30,116,255,0.6),
                0 0 18px rgba(30,113,255,0.8);
        }

        p {
            color: #aeb8d4;
        }

        .box {
            background-color: #151d35;
            width: 400px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px #202d55;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px;
            border-radius: 8px;
            border: none;
            font-family: 'Orbitron', sans-serif;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background-color: #4d7cff;
            color: white;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            color: #7ea2ff;
            font-size: 14px;
        }

</style>

<!-- some css properties derived from old projects -->
</head>


<body>

    <h1>ICT CLUB Checker</h1>
    <p>Candidate Membership Verification</p>

    <div class="box">

        <input type="text" id="Fname" placeholder="First Name">
        <input type="text" id="Lname" placeholder="Last Name">

        <br>

        <button py-click="check_member">Check Membership</button>

        <div id="result"></div>

    </div>

<script type="py" src="main.py"></script>

</body>

</html>
